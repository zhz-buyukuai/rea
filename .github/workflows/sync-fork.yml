name: Sync fork

on:
  schedule:
    # Daily at 00:00 UTC (08:00 Beijing time).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh repo sync "${{ github.repository }}"
          --source morluto/rea
          --branch main
